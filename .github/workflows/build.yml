name: Build CoreFrame

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo \
            gir1.2-webkit2-4.1 || sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-webkit2-4.0

      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller==6.17.0

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm CoreFrame.spec

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile \
            --name CoreFrame \
            --collect-all ssl \
            --additional-hooks-dir hooks \
            --add-data "static:static" \
            --add-data "extensions/fortune_cookie:extensions/fortune_cookie" \
            --hidden-import engineio.async_drivers.threading \
            --hidden-import eventlet \
            --hidden-import psutil \
            --hidden-import requests \
            --hidden-import PIL.Image \
            --hidden-import PIL._imaging \
            --hidden-import PIL._imagingcms \
            --hidden-import PIL._imagingft \
            --hidden-import gi \
            --hidden-import gi.repository.GLib \
            --hidden-import gi.repository.GObject \
            --hidden-import gi.repository.Gio \
            --hidden-import gi.repository.Gdk \
            --hidden-import gi.repository.Gtk \
            --hidden-import gi.repository.WebKit2 \
            --hidden-import webview \
            --hidden-import webview.platforms.gtk \
            --exclude numpy \
            --exclude pythoncom \
            run_coreframe.pyw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreFrame-${{ runner.os }}
          path: |
            dist/CoreFrame.exe
            dist/CoreFrame

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            artifacts/CoreFrame-Windows/CoreFrame.exe#CoreFrame-Windows.exe \
            artifacts/CoreFrame-Linux/CoreFrame#CoreFrame-Linux \
            --title "CoreFrame $TAG" \
            --notes "" 2>/dev/null || true
