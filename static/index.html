<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreFrame</title>
  <link rel="stylesheet" href="/css/palette.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/core-effects.css">
  <link rel="stylesheet" href="/css/widget-control.css">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <script src="/js/socket.io.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo">CF</div>
        <span class="topbar-title">CoreFrame</span>
      </div>
      <div class="scene-bar" id="scene-bar"></div>
      <nav class="topbar-nav" id="sidebar-nav"></nav>

      <div class="topbar-info">
        <span class="hud-dot" id="connection-dot"></span>
        <span id="header-clock">--:--:--</span>
        <button class="topbar-reload" id="btn-install" title="Install extension (.zip)">+</button>
        <button class="topbar-reload" id="btn-package" title="Package extension" style="display:none"><i data-feather="package" width="16" height="16"></i></button>
        <button class="topbar-reload" id="btn-reload" title="Restart server" style="display:none">⟳</button>
        <button class="topbar-reload" id="btn-settings" title="Settings">&#x2699;</button>
        <button class="topbar-reload" id="btn-minimize" title="Minimize">−</button>
      </div>
    </header>

    <main id="main">
      <div id="main-content">
        <div class="loading"><div class="spinner"></div>Loading extensions...</div>
      </div>
    </main>
  </div>



  <div id="overlay"></div>
  <div id="result-panel">
    <div class="result-panel-header">
      <span id="result-panel-title">Action</span>
      <span class="result-panel-close" id="result-panel-close">&times;</span>
    </div>
    <div class="result-panel-body" id="result-panel-body"></div>
  </div>
  <input type="file" id="scene-img-input" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" style="display:none">

  <script src="/api/debug.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/widgets.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/widget-control/00-state.js"></script>
  <script src="/js/widget-control/01-scenes.js"></script>
  <script src="/js/widget-control/02-layout.js"></script>
  <script src="/js/widget-control/03-menus-styles.js"></script>
  <script src="/js/widget-control/04-init.js"></script>
</body>
</html>
