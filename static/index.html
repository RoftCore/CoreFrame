<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreFrame</title>
  <link rel="stylesheet" href="/css/palette.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/utilities.css">
  <link rel="stylesheet" href="/css/core-effects.css">
  <link rel="stylesheet" href="/css/widget-control.css">
  <script src="/js/socket.io.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo">CF</div>
        <span class="topbar-title">CoreFrame</span>
      </div>
      <nav class="topbar-nav" id="sidebar-nav"></nav>

      <div class="topbar-info">
        <span class="hud-dot" id="connection-dot"></span>
        <span id="header-clock">--:--:--</span>
        <button class="topbar-reload" id="btn-install" title="Install extension (.zip)">+</button>
        <button class="topbar-reload" id="btn-package" title="Package extension">&#x1F4E6;</button>
        <button class="topbar-reload" id="btn-reload" title="Restart server">⟳</button>
        <div class="settings-container">
          <button class="topbar-reload" id="btn-settings" title="Settings">&#x2699;</button>
          <div class="settings-dropdown" id="settings-dropdown">
            <div class="settings-option" data-mode="windowed">Windowed</div>
            <div class="settings-option" data-mode="frameless">Frameless</div>
            <div class="settings-option" data-mode="fullscreen">Fullscreen</div>
          </div>
        </div>
      </div>
    </header>

    <main id="main">
      <div id="main-content">
        <div class="loading"><div class="spinner"></div>Loading extensions...</div>
      </div>
    </main>
  </div>



  <div id="overlay"></div>
  <div id="result-panel">
    <div class="result-panel-header">
      <span id="result-panel-title">Action</span>
      <span class="result-panel-close" id="result-panel-close">&times;</span>
    </div>
    <div class="result-panel-body" id="result-panel-body"></div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/widgets.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/widget-control.js"></script>
</body>
</html>
